<style>
/* Itinerary page styles. Colours and fonts are the CSS variables at the top - change them to re-theme the page. */

:root{
  --ink:#211F1B; --ink-soft:#57534A;
  --paper:#EFEAE0; --paper-2:#E5DECB; --paper-3:#D8D0C0;
  --indigo:#1C3155; --indigo-deep:#12213B; --indigo-soft:#3A5A7C;
  --shu:#BC4B34; --shu-soft:#F3E2DB;
  --gold:#A9821F; --gold-soft:#F2E6C4;
  --moss:#4B6A48;
  --font-body:'Zen Kaku Gothic New',sans-serif; --font-display:'Shippori Mincho',serif; --font-mono:'JetBrains Mono',monospace;
  --radius:12px;
  --shadow:0 2px 10px rgba(19,32,47,0.10), 0 1px 2px rgba(19,32,47,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
h1,h2,h3,.disp{font-family:var(--font-display);}
::selection{background:var(--shu); color:#fff;}

.sticky-top{position:sticky; top:0; z-index:40; box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.top{background:var(--indigo-deep); color:var(--paper); padding:16px 16px 10px;}
.top{position:relative;}
.title-row{padding-right:40px; display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.top h1{font-size:22px; margin:0; font-weight:700; color:#fff;}
.top .dates{font-family:var(--font-mono); font-size:11px; color:#C7C2B6;}
.top .data-src{font-family:var(--font-mono); font-size:10px; color:#B8B2A2; opacity:.85; margin-top:3px;}
.top .data-src.warn{color:#F2C27B; opacity:1;}
.top .subtitle{font-size:12px; color:#B8B2A2; margin-top:4px;}

.search-row{display:flex; gap:8px; margin-top:12px;}
/* Collapsible header: the ▴/▾ button hides the dates, route, data line and search */
.header-toggle{position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:999px; border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; font-size:14px; line-height:1; cursor:pointer; padding:0;}
.header-toggle:active{background:rgba(255,255,255,.12);}
.top.collapsed{padding:10px 16px;}
.top.collapsed .header-toggle{top:7px;}
.top.collapsed .dates, .top.collapsed .subtitle, .top.collapsed .data-src, .top.collapsed .search-row, .top.collapsed .trip-pages{display:none;}
.top.collapsed .title-row{flex-wrap:nowrap;}
.top.collapsed h1{font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.search-wrap{flex:1; position:relative;}
.search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%);}
#searchInput{
  width:100%; padding:9px 10px 9px 32px; border-radius:999px; border:none;
  font-family:var(--font-body); font-size:13px; background:#fff; color:var(--ink);
}
#searchInput:focus{outline:2px solid var(--shu);}

.chip-row{display:flex; gap:6px; overflow-x:auto; padding:10px 16px; background:var(--indigo); -webkit-overflow-scrolling:touch;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto; font-family:var(--font-mono); font-size:11px; letter-spacing:0.02em;
  padding:6px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.25);
  background:transparent; color:#DCD8CC; cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--shu); border-color:var(--shu); color:#fff; font-weight:700;}

.map-panel{position:relative; background:var(--paper-2); border-bottom:1px solid var(--paper-3);}
#leafletMap{height:150px; width:100%; }
.map-resize-handle{
  height:16px; width:100%; cursor:ns-resize;
  display:flex; align-items:center; justify-content:center;
  background:var(--paper-2); border-top:1px solid var(--paper-3);
  touch-action:none;
}
.resize-grip{width:36px; height:4px; border-radius:99px; background:var(--paper-3);}
.map-resize-handle:hover .resize-grip, .map-resize-handle.dragging .resize-grip{background:var(--indigo-soft);}
.map-expand-btn{
  position:absolute; right:10px; bottom:10px; z-index:2000;
  width:34px; height:34px; border-radius:50%; border:none; background:#fff;
  box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:15px; color:var(--indigo);
}
.locate-btn{
  position:absolute; right:10px; bottom:52px; z-index:2000;
  width:34px; height:34px; border-radius:50%; border:none; background:#fff;
  box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--indigo);
}
.locate-btn.active{color:#fff; background:var(--shu);}
.locate-btn svg{pointer-events:none;}
.user-dot{
  width:14px; height:14px; border-radius:50%;
  background:#2A7DE1; border:3px solid #fff; box-shadow:0 0 0 2px rgba(42,125,225,0.5), 0 1px 4px rgba(0,0,0,0.4);
}
.user-accuracy{ background: rgba(42,125,225,0.12); border: 1px solid rgba(42,125,225,0.35); }
.locate-error{
  position:absolute; left:10px; right:50px; bottom:10px; z-index:500;
  background:#fff; border-radius:8px; padding:8px 10px; font-size:11px; color:var(--shu);
  box-shadow:var(--shadow); display:none;
}
.leaflet-popup-content{font-family:var(--font-body); min-width:190px;}
.leaflet-control-attribution{font-size:8px !important; padding:0 3px !important; line-height:1.3 !important;}
.popup-name{font-weight:700; font-size:13px; color:var(--indigo-deep);}
.popup-cat{font-size:10px; color:var(--shu); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;}
.popup-note{font-size:12px; color:var(--ink-soft); margin-top:5px; line-height:1.4;}
.popup-maps{display:inline-block; margin-top:6px; font-size:11px; font-weight:700; color:var(--indigo);}

.result-bar{
  display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 10px;
  padding:10px 16px; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);
  border-bottom:1px solid var(--paper-3);
}

.wrap{max-width:900px; margin:0 auto; padding-bottom:60px;}

.day-block{border-bottom:1px solid var(--paper-3);}
.day-header{
  display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; background:#fff;
}
.day-header .day-stamp{
  font-family:var(--font-display); font-weight:800; font-size:26px; color:var(--indigo);
  min-width:38px;
}
.dh-left{flex:1;}
.dh-left h2{margin:0; font-size:15px; font-weight:700; color:var(--ink);}
.day-meta{font-size:11px; color:var(--ink-soft); margin-top:2px; font-family:var(--font-mono);}
.day-header .type-tag{
  font-family:var(--font-mono); font-size:9px; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--shu); border:1px solid var(--shu); padding:2px 6px; border-radius:3px; margin-left:6px;
}
.chev{transition:transform .15s; color:var(--ink-soft); font-size:14px;}
.day-block.open .chev{transform:rotate(90deg);}
.day-body{display:none; padding:6px 12px 16px; background:var(--paper);}
.day-block.open .day-body{display:block;}
.float-collapse-btn{
  display:none; position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  z-index:1500; background:var(--indigo); color:#fff; border:none; border-radius:999px;
  padding:10px 18px; font-family:var(--font-mono); font-weight:700; font-size:12px;
  box-shadow:0 3px 12px rgba(0,0,0,0.3); cursor:pointer; white-space:nowrap;
}
.float-collapse-btn.visible{display:block;}
.visited-toggle{
  position:absolute; right:10px; top:-9px; z-index:5;
  background:#fff; border:1.5px solid var(--paper-3); border-radius:999px;
  padding:2px 8px; font-family:var(--font-mono); font-weight:700; font-size:9px;
  cursor:pointer; color:var(--ink-soft);
}
.stop-card.visited-card .visited-toggle{background:var(--moss); color:#fff; border-color:var(--moss);}
.stop-card.visited-card{opacity:0.55;}
.stop-card.visited-card .stop-name{text-decoration:line-through; text-decoration-color:var(--moss);}
.visited-count-badge{margin-left:auto; font-weight:700; color:var(--moss);}
.collapse-all-btn{
  background:var(--paper-2); border:1px solid var(--paper-3); border-radius:6px;
  padding:3px 10px; font-family:var(--font-mono); font-weight:700; font-size:10px;
  color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.collapse-all-btn:hover{background:var(--paper-3); color:var(--ink);}


.pool-block{border-bottom:1px solid var(--paper-3);}
.pool-block .day-header{background:var(--gold-soft);}
.pool-block .dh-left h3{margin:0; font-size:14px; font-weight:700; color:var(--gold); font-family:var(--font-display);}
.pool-block .day-body{display:none; padding:6px 12px 16px; background:#FBF6E9;}
.pool-block.open .day-body{display:block;}
.pool-block.open .chev{transform:rotate(90deg);}

.stop-card{
  background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:10px 12px; margin:6px 0;
  border-left:5px solid var(--paper-3);
  position:relative;
  padding-left:36px;
}
.step-badge{
  position:absolute; left:-4px; top:-4px;
  width:24px; height:24px; border-radius:50%;
  background:var(--indigo); color:#fff;
  font-family:var(--font-mono); font-weight:700; font-size:11px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,0.25);
}
.status-ribbon{
  position:absolute; left:0; top:0; bottom:0; width:36px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:800; font-size:8px; letter-spacing:0.03em;
  writing-mode:vertical-rl; text-orientation:mixed;
  color:#fff;
}
.stop-card:not(.maybe-card) .status-ribbon{background:var(--moss);}
.stop-card.maybe-card .status-ribbon{background:var(--gold);}
.maybe-badge{
  position:absolute; right:10px; top:-9px;
  background:#9A9488; color:#fff;
  font-family:var(--font-mono); font-weight:800; font-size:9px; letter-spacing:0.06em;
  padding:3px 9px; border-radius:999px;
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
  border:1.5px solid #fff;
}
.scheduled-badge{
  position:absolute; right:10px; top:-9px;
  background:var(--moss); color:#fff;
  font-family:var(--font-mono); font-weight:800; font-size:9px; letter-spacing:0.06em;
  padding:3px 9px; border-radius:999px;
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
  border:1.5px solid #fff;
}
.priority-badge{
  position:absolute; left:26px; top:-9px;
  background:#B8860B; color:#fff;
  font-family:var(--font-mono); font-weight:800; font-size:9px; letter-spacing:0.06em;
  padding:3px 9px; border-radius:999px;
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
  border:1.5px solid #fff;
}
.backup-badge{
  position:absolute; left:26px; top:-9px;
  background:var(--paper-3); color:var(--ink-soft);
  font-family:var(--font-mono); font-weight:700; font-size:9px; letter-spacing:0.06em;
  padding:3px 9px; border-radius:999px;
  box-shadow:0 1px 4px rgba(0,0,0,0.2);
  border:1.5px solid #fff;
}
.stop-card.maybe-card{
  border-left-style:dashed;
  border-left-color:#9A9488 !important;
  background:#F1EFEA;
}
.stop-card.maybe-card .stop-name{color:#5C574C;}
.stop-card:not(.maybe-card){background:#fff;}
.stop-card.cat-food, .stop-card.cat-restaurant{border-left-color:var(--shu);}
.stop-card.cat-cafe{border-left-color:var(--gold);}
.stop-card.cat-shopping{border-left-color:var(--moss);}
.stop-card.cat-craft-workshop{border-left-color:var(--indigo-soft);}
.stop-card.cat-temple-shrine{border-left-color:#8B4A6B;}
.stop-card.cat-garden-park{border-left-color:#4B7A5A;}
.stop-card.cat-snacks-sweets{border-left-color:#C77B3C;}
.stop-card.maybe-card.cat-food, .stop-card.maybe-card.cat-restaurant,
.stop-card.maybe-card.cat-cafe, .stop-card.maybe-card.cat-shopping,
.stop-card.maybe-card.cat-craft-workshop{border-left-color:#9A9488;}
.stop-name{font-weight:700; font-size:13px; color:var(--ink); line-height:1.25; display:inline;}
.stop-name.clickable-name{cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--indigo-soft); text-underline-offset:3px;}
.stop-name.clickable-name:hover{color:var(--indigo);}
.stop-name .star{color:var(--gold); margin-right:3px;}
.meta-row-1{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:5px; font-size:10.5px; color:var(--ink-soft); margin-top:2px;
}
.meta-row-1 .sep{color:var(--paper-3);}
.meta-row-1 .hours{color:var(--indigo); font-weight:700;}
.meta-row-1 .price{color:#8A6647; font-weight:700;}
.stop-note{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.45;}
.meta-row-2{
  display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:6px;
}
.stop-tags{display:flex; gap:4px; flex-wrap:wrap;}
.tag-pill{font-size:9px; background:var(--paper-2); color:var(--ink-soft); padding:2px 7px; border-radius:999px; font-weight:600;}
.meal-pill{font-size:9px; background:var(--indigo); color:#fff; padding:2px 7px; border-radius:999px; font-weight:700;}
.best-time-inline{font-size:10px; color:var(--moss); font-weight:700;}
.highlight-line{font-size:11px; color:var(--shu); font-weight:600; margin-top:6px; line-height:1.35; background:var(--shu-soft); padding:5px 9px; border-radius:7px;}
.reservation-line{font-size:10px; color:var(--indigo); font-weight:700; margin-top:4px;}
.reservation-line.required{color:var(--shu);}
.maps-link{display:inline-flex; align-items:center; font-size:10px; font-weight:700; color:var(--indigo); margin-top:6px; text-decoration:none; border-bottom:1px solid var(--indigo-soft);}

.no-results{text-align:center; padding:60px 20px; color:var(--ink-soft); font-family:var(--font-mono); font-size:12px;}
footer.note{text-align:center; font-size:11px; color:var(--ink-soft); padding:20px; font-family:var(--font-mono);}

@media(max-width:640px){
  .top h1{font-size:19px;}
  .day-header .day-stamp{font-size:22px;}
}

/* Trip switcher and trip chooser */
.trip-switch{ text-align:center; font-size:12px; color:var(--ink-soft); padding:0 16px 28px; }
.trip-switch a, .trip-list a{ color:var(--indigo, #22405f); }
.trip-list{ list-style:none; padding:0; margin:14px 0 0; line-height:2; }

/* Extra pages for a trip (pages: [...] in trip.config.js) */
.trip-pages{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.trip-pages:empty{display:none;}
.trip-pages a{font-size:12px; font-weight:700; color:#fff; text-decoration:none; padding:3px 10px; border:1px solid rgba(255,255,255,.35); border-radius:999px;}
.trip-pages a:hover{background:rgba(255,255,255,.12);}
</style>
</head>
<body>

<div class="sticky-top" id="stickyTop">
  <header class="top">
    <button id="headerToggle" class="header-toggle" type="button" aria-expanded="true" aria-controls="tripHeaderDetails" title="Hide header and search">▴</button>
    <div class="title-row">
      <h1 class="disp" id="tripTitle"></h1>
      <div class="dates" id="tripDates"></div>
    </div>
    <div class="subtitle" id="tripSubtitle"></div>
    <nav class="trip-pages" id="tripPages"></nav>
    <div class="data-src" id="dataSource"></div>
    <div class="search-row">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#22405f" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        <input id="searchInput" type="text" placeholder="Search a name, neighborhood, dish…" autocomplete="off">
      </div>
    </div>
  </header>
  <div class="chip-row" id="chipRow"></div>
  <div class="map-panel" id="mapPanel">
    <div id="leafletMap"></div>
    <button id="locateBtn" class="locate-btn" title="Show my location">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <div class="locate-error" id="locateError"></div>
    <div class="map-resize-handle" id="mapResizeHandle" title="Drag to resize the map">
      <div class="resize-grip"></div>
    </div>
  </div>
  <div class="result-bar">
    <span id="resultCount"></span>
    <span id="catFilterLabel"></span>
    <button id="collapseAllBtn" class="collapse-all-btn" title="Collapse all expanded days">▲ Collapse All</button>
    <span id="visitedCount" class="visited-count-badge"></span>
  </div>
</div>

<div class="wrap" id="routeContainer"></div>
<div class="no-results" id="noResults" style="display:none;">No stops match — try a different search or category.</div>
<footer class="note" id="footerNote"></footer>
<nav class="trip-switch" id="tripSwitch"></nav>

irectly in front of Takayama Jinya, convenient for combining with sightseeing. | Souvenir snack: Same as Miyagawa — hoba miso, pickles, local sake.", "lat": 36.1396447, "lng": 137.2582195, "tags": ["Market"], "must": false, "meal": ["breakfast"], "bestTime": "~8:20am, a quick look before Takayama Jinya opens at 8:45", "price": "¥100-¥3,000", "highlight": "Local vegetables", "reservation": "Free entry.", "mapsLink": "https://maps.google.com/?q=Jinya+Mae+Morning+Market+Takayama", "tabelog": "", "ig": "", "website": "", "day_order": 2.0, "d": 16, "maybe": false, "priorityStatus": ""}, {"n": "Kyouya", "city": "Takayama · Oshinmachi (Oshinmachi 1-77)", "cat": "Restaurant", "h": "11:00-14:00, 17:00-20:00; closed Tuesdays (Tabelog, checked 15 Oct 2026)", "note": "Family-run restaurant in Takayama's old town since 1979, run by Hida native Kyoko Nishimura; known for hoba miso — local red miso mixed with wild mountain vegetables and mushrooms, grilled tableside on a dried magnolia leaf, a dish she grew up eating. Also serves it combined with Hida beef. Tabelog 3.33 (112 reviews) - below your 3.5 line. | Souvenir snack: Jarred hoba miso paste to take home and grill yourself.", "lat": 36.1462619, "lng": 137.2589866, "tags": ["hoba miso", "regional specialty", "family-run", "local"], "must": false, "meal": ["lunch", "dinner"], "bestTime": "~11:15am, walk-in - lunch ends 2:00pm", "price": "¥2,000-¥6,000", "highlight": "Hoba miso", "reservation": "Reservations only accepted for dinner - if using for lunch, walk-in only.", "mapsLink": "https://www.google.com/maps/search/?api=1&query=%E9%A3%9B%E9%A8%A8%E9%AB%98%E5%B1%B1%20%E4%BA%AC%E3%82%84%20%E5%B2%90%E9%98%9C%E7%9C%8C%E9%AB%98%E5%B1%B1%E5%B8%82%E5%A4%A7%E6%96%B0%E7%94%BA1-77", "tabelog": "https://tabelog.com/en/gifu/A2104/A210401/21000305/", "ig": "", "website": "", "day_order": 7.0, "d": 16, "maybe": false, "priorityStatus": "PRIORITY"}, {"n": "Miyagawa Morning Market", "city": "Takayama · Miyagawa River", "cat": "Market", "h": " estival.", "lat": 36.1481824, "lng": 137.2602971, "tags": ["Temple / Shrine"], "must": false, "meal": [], "bestTime": "~12:30pm, about 4 min walk north from Kyouya", "price": "Free", "highlight": "Shrine grounds", "reservation": "Free admission.", "mapsLink": "https://maps.google.com/?q=Sakurayama+Hachimangu+Shrine+Takayama", "tabelog": "", "ig": "", "website": "", "day_order": 8.0, "d": 16, "maybe": false, "priorityStatus": ""}, {"n": "Sanmachi Suji Historic District", "city": "Takayama · Sanmachi Suji", "cat": "Attraction", "h": "Streets 24h; shops ~9:00-17:00", "note": "Takayama's most famous historic neighborhood, featuring preserved Edo-period merchant houses, sake breweries, craft shops and cafes. [This is the historic street itself — a district to walk through, not one address.] Also a genuine shopping stop, not just a walk-through - hand-carved chopsticks, Hida lacquerware, local handcrafts, and free sake tastings at the breweries along the street. Most shops close by 5pm. Snack-wise, look out for gohei mochi (grilled rice cakes on a stick, brushed with sweet-savory sauce), mitarashi dango, and Hida beef sushi/skewers sold at small stalls along the street - no need to seek out one specific vendor, they're everywhere.", "lat": 36.1413161, "lng": 137.2596227, "tags": ["Attraction"], "must": true, "meal": [], "bestTime": "~1:20pm, about 11 min walk south from Sakurayama - most shops close by 5pm", "price": "Free; shopping/food extra", "highlight": "Wooden merchant houses", "reservation": "Free to walk around.", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Sanmachi%20Suji%20Takayama%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 9.0, "d": 16, "maybe": false, "priorityStatus": ""}, {"n": "Sukeharu Butcher Shop", "city": "Takayama · Old Town (Kamiichinomachi 19)", "cat": "Shopping", "h": "10:00-17:00; closed Tuesdays (Wanderlog - not on an official page)", "note": "Mom-and-pop Hida beef butcher shop selling street-food-style juicy H  floors alongside men's - accessible mid-tier pricing, curated Japanese and international brands, everyday wardrobe staples rather than avant-garde design. Right in Harajuku, same strip as your existing RagTag stop.", "lat": 35.6648495, "lng": 139.7146551, "tags": ["Japanese brand", "select shop", "mid-tier", "convenient", "not designer"], "must": false, "meal": [], "bestTime": "Afternoon", "price": "yen (accessible mid-tier)", "highlight": "", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=United%20Arrows%20Harajuku%20flagship%20Tokyo%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 16.0, "d": 26, "maybe": false, "priorityStatus": ""}, {"n": "BEAMS Women Harajuku", "city": "Tokyo · Harajuku", "cat": "Shopping", "h": "11:00-20:00", "note": "Dedicated women's BEAMS store - three labels under one roof (Ray BEAMS for trend/everyday pieces, International Gallery BEAMS for curated domestic/international designers, Vermeerist BEAMS for special vintage-adjacent pieces). Accessible mid-tier pricing, on the same Harajuku strip as RagTag.", "lat": 35.6716447, "lng": 139.708186, "tags": ["women's clothing", "Japanese brand", "select shop", "mid-tier", "convenient"], "must": false, "meal": [], "bestTime": "Afternoon", "price": "yen (accessible mid-tier)", "highlight": "", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=BEAMS%20Women%20Harajuku%20Tokyo%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 17.0, "d": 26, "maybe": false, "priorityStatus": ""}, {"n": "Kadota", "city": "Tokyo · Ebisu", "cat": "Restaurant", "h": "12:00-14:00 (lunch only, closes when sold out)", "note": "Hidden basement teishoku spot with minimal signage - a queue of local office workers forms daily. Salt-grilled or miso-glazed fish sets, most around 1,080 yen. Right in Ebisu, same neighborhood as your other Day 26 stops.", "lat": 35.6479096, "lng": 139.7091976, "tags": ["teishoku", "local", "hidden gem"], "must": false, "meal": ["lunch"], "bestTime": "Right at noon, before the local lunch crowd", "price": "yen (~1,080)", "highlight": "", "reservation": "Walk-in, arrive early - closes when sold out", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Kadota%20teishoku%20Ebisu%20Tokyo%20Japan", "tabelog": "https://tabelog.com/en/tokyo/A1303/A130302/13016622/", "ig": "", "website": "", "day_order": 3.0, "d": 26, "maybe": false, "priorityStatus": "PRIORITY"}, {"n": "Nijo Castle", "city": "Kyoto · Nakagyo Ward", "cat": "Attraction", "h": "8:45-16:00 (last entry), closed some Tuesdays", "note": "UNESCO World Heritage former residence of the Tokugawa shoguns - famous for its 'nightingale floors' (uguisubari) that chirp underfoot as a security measure against intruders, plus the ornate Ninomaru Palace and its screen paintings. Scheduled on Day 17 after you arrive from Nagoya (~1:55pm) - last entry is 4:00pm, so go straight after dropping your bags.", "lat": 35.0140379, "lng": 135.7484258, "tags": ["UNESCO", "castle", "major attraction"], "must": true, "meal": [], "bestTime": "Day 17, ~3:00pm after dropping bags - last entry 4:00pm", "price": "yen (admission required)", "highlight": "Walk the nightingale floors slowly to hear them chirp", "reservation": "Walk-in, buy ticket at gate", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Nijo%20Castle%20Kyoto%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 8.0, "d": 17, "maybe": false, "priorityStatus": ""}, {"n": "Day 27 breakfast (near your hotel)", "city": "Tokyo · Wherever you are staying", "cat": "Restaurant", "h": "Morning", "note": "Keep this quick and simple - a real morning window is only about 4-5 hours before you need to leave for Haneda by roughly 1:00-1:15pm (3hr buffer + ~40min travel time for a 4:50pm flight). Grab breakfast near your hotel, then either: (a) head back to any Day 26 shop you didn't finish (RagTag, BEAMS Women Harajuku, United Arrows, 2nd Street, Brand Collect), or (b) go to KOMEHYO instead for a single efficient stop covering watches/leather/secondhand in one building.", "lat": null, "lng": null, "tags": ["flexible", "departure day"], "must": false, "meal": ["breakfast"], "bestTime": "Morning, keep it quick", "price": "", "highlight": "", "reservation": "", "mapsLink": "", "tabelog": "", "ig": "", "website": "", "day_order": 1.0, "d": 27, "maybe": false, "priorityStatus": ""}, {"n": "Quick lunch before Haneda", "city": "Tokyo · Near wherever shopping ends", "cat": "Restaurant", "h": "~12:30-1:00pm", "note": "Keep this simple and fast - a conbini onigiri, a depachika bento, or a quick counter meal near your last stop. Don't plan a sit-down restaurant here; the goal is to be walking toward the station/Haneda by 1:00-1:15pm.", "lat": null, "lng": null, "tags": ["flexible", "quick", "departure day"], "must": false, "meal": ["lunch"], "bestTime": "~12:30pm", "price": "", "highlight": "", "reservation": "", "mapsLink": "", "tabelog": "", "ig": "", "website": "", "day_order": 4.0, "d": 27, "maybe": false, "priorityStatus": ""}, {"n": "Matsumoto Kiyoshi (drugstore)", "city": "Tokyo · Ueno/Yanaka area", "cat": "Shopping", "h": "10:00-21:00 (typical)", "note": "Japan's most common drugstore chain, on nearly every block in Tokyo - the best place for everyday/budget skincare (Hada Labo, Biore, Melano CC, Canmake, Kose) at accessible prices, plus tax-free shopping for tourists. Don't need to seek out a specific branch, just pop into any Matsumoto Kiyoshi you pass.", "lat": 35.7106717, "lng": 139.7744501, "tags": ["skincare", "drugstore", "convenient", "everyday brands"], "must": false, "meal": [], "bestTime": "Anytime", "price": "yen (budget)", "highlight": "", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Matsumoto%20Kiyoshi%20drugstore%20Ueno%20Tokyo%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 17.0, "d": 9, "maybe": false, "priorityStatus": ""}, {"n": "@cosme TOKYO", "city": "Tokyo · Harajuku", "cat": "Shopping", "h": "11:00-20:00", "note": "Curated cosmetics/skincare specialty store ranking products by real user reviews - a step up from a drugstore, good for discovering trending Japanese brands with test samples available. Right in Harajuku, on your existing Day 26 route.", "lat": 35.6701458, "lng": 139.7031743, "tags": ["skincare", "curated", "Harajuku", "convenient"], "must": false, "meal": [], "bestTime": "Afternoon", "price": "yen (mid-range)", "highlight": "", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=cosme%20TOKYO%20Harajuku%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 18.0, "d": 26, "maybe": false, "priorityStatus": ""}, {"n": "Daiso Harajuku (100 yen shop)", "city": "Tokyo · Takeshita Street, Harajuku", "cat": "Shopping", "h": "9:30-21:00", "note": "The biggest Daiso in Tokyo - 4 floors, right on Takeshita Street. Almost everything is 100-500 yen: stickers, stationery, small gifts, a huge snack selection (Green Tea Kit Kats are the classic haul), travel-size goods. Genuinely good for affordable souvenirs when buying for a lot of people - locals shop here too, not just tourists. For stickers specifically, B-Side Label (Kanazawa or Yokohama) has more special/collectible options than Daiso's generic sheets.", "lat": 35.6715621, "lng": 139.7037819, "tags": ["souvenirs", "stickers", "stationery", "snacks", "affordable", "bulk-friendly"], "must": false, "meal": [], "bestTime": "Afternoon, expect it to be crowded on weekends", "price": "yen (100-500 per item, very affordable)", "highlight": "Head upstairs first for unique finds, save the snack section (ground floor) for last", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Daiso%20Harajuku%20Takeshita%20Street%20Tokyo%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 19.0, "d": 26, "maybe": false, "priorityStatus": ""}, {"n": "B-Side Label (Yokohama Red Brick Warehouse)", "city": "Yokohama · Shinko", "cat": "Shopping", "h": "10:00-19:00 (varies seasonally)", "note": "Made-in-Japan sticker brand - high-quality waterproof, UV-protected stickers that genuinely last 3+ years without peeling, 5,000+ designs spanning Pokemon/One Piece collabs to local Japanese motifs, ~200-300 yen each with a free sticker on purchase. This location is inside the Red Brick Warehouse.", "lat": 35.4534, "lng": 139.6428, "tags": ["stickers", "collectible", "made in Japan", "affordable", "convenient"], "must": false, "meal": [], "bestTime": "Afternoon", "price": "yen (~200-300 per sticker)", "highlight": "Ask staff for design recommendations - they know the collection well", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=B-Side%20Label%20Yokohama%20Red%20Brick%20Warehouse%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 13.0, "d": 24, "maybe": false, "priorityStatus": ""}, {"n": "B-Side Label (Kanazawa FORUS)", "city": "Kanazawa · Kanazawa Station (Kanazawa FORUS 3F, Horikawa-shinmachi)", "cat": "Shopping", "h": "10:00-20:00", "note": "Same B-Side Label sticker brand, this branch is on the 3rd floor of Kanazawa FORUS, the mall beside Kanazawa Station (same building as Mori Mori Sushi on 6F). Waterproof, UV-protected, made in Japan.", "lat": 36.5791483, "lng": 136.6497543, "tags": ["stickers", "collectible", "made in Japan", "affordable", "convenient"], "must": false, "meal": [], "bestTime": "Anytime", "price": "yen (~200-300 per sticker)", "highlight": "", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=B-SIDE%20LABEL%20%E9%87%91%E6%B2%A2%E3%83%95%E3%82%A9%E3%83%BC%E3%83%A9%E3%82%B9%20%E7%9F%B3%E5%B7%9D%E7%9C%8C%E9%87%91%E6%B2%A2%E5%B8%82%E5%A0%80%E5%B7%9D%E6%96%B0%E7%94%BA3-1", "tabelog": "", "ig": "", "website": "", "day_order": 11.0, "d": 13, "maybe": false, "priorityStatus": ""}, {"n": "Kit Kat Chocolatory (Tokyo Station)", "city": "Tokyo · Marunouchi (Daimaru basement)", "cat": "Shopping", "h": "10:00-20:00", "note": "Boutique Kit Kat shop overseen by patissier Yasumasa Takagi - premium exclusive flavors (Sublime chocolate line, seasonal varieties) with much nicer gift-box packaging than convenience-store Kit Kats. In the basement of Daimaru, directly connected to Tokyo Station. A genuinely good affordable, giftable, uniquely-Japanese food souvenir for a group.", "lat": 35.681588, "lng": 139.7688857, "tags": ["Kit Kat", "food souvenir", "giftable", "affordable", "convenient"], "must": false, "meal": [], "bestTime": "Same trip as the Daimaru food hall - closes 8pm", "price": "yen (~324/bar, ~432/4-pack mini)", "highlight": "Check what's in stock - flavors rotate seasonally and some sell out", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Kit%20Kat%20Chocolatory%20Daimaru%20Tokyo%20Station%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 5.0, "d": 23, "maybe": false, "priorityStatus": ""}, {"n": "Iwata Coffee Shop", "city": "Kamakura · Near Kamakura Station", "cat": "Cafe", "h": "9:30-18:00, last order ~16:30; closed Tuesdays and the 2nd Wednesday", "note": "Historic kissaten established 1945, near Kamakura Station - pale-yellow European-style exterior, cozy brown leather booths that have kept their character for 80 years. Rumored to have been frequented by John Lennon and Yoko Ono. Famous for hot cakes over 3cm thick (20-30 min to cook, and longer waits on busy weekends) alongside sandwiches. Tabelog 3.71.", "lat": 35.3194618, "lng": 139.5514, "tags": ["kissaten", "historic", "1945"], "must": false, "meal": ["afternoon"], "bestTime": "~4:22pm - last order is around 4:30pm. If there is a queue, skip it and go on to Kotori", "price": "yen (mid-range)", "highlight": "", "reservation": "Walk-in, can have a wait", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Iwata%20Coffee%20Shop%20Kamakura%20Japan", "tabelog": "https://tabelog.com/en/kanagawa/A1404/A140402/14002091/", "ig": "", "website": "", "day_order": 11.0, "d": 11, "maybe": false, "priorityStatus": ""}, {"n": "Noge District (dinner alternative)", "city": "Yokohama · Noge", "cat": "Restaurant", "h": "Evening, varies by shop", "note": "Yokohama's Showa-era drinking district, a few stops from Chinatown - small izakaya and bars packed into narrow lanes, a good alternative to Manchinro if you want something more casual/local for dinner.", "lat": 35.4481821, "lng": 139.630004, "tags": ["izakaya", "local", "alternative"], "must": false, "meal": ["dinner"], "bestTime": "Evening", "price": "yen (budget-mid)", "highlight": "", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Noge%20district%20Nishi%20Yokohama%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 15.0, "d": 24, "maybe": false, "priorityStatus": "BACKUP #1"}, {"n": "Gyoza Hohei", "city": "Kyoto · Gion", "cat": "Restaurant", "h": "Evening, varies", "note": "Fabulously garlicky pan-fried gyoza right in the middle of Gion, the geisha district. You might spot a maiko or geiko enjoying a plate here too.", "lat": 35.0051977, "lng": 135.7745224, "tags": ["gyoza", "Gion", "convenient", "local favorite"], "must": false, "meal": ["dinner"], "bestTime": "Evening", "price": "yen (budget-mid)", "highlight": "", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Gyoza%20Hohei%20Gion%20Kyoto%20Japan", "tabelog": "https://tabelog.com/en/kyoto/A2601/A260301/26018951/", "ig": "", "website": "", "day_order": 26.0, "d": 18, "maybe": false, "priorityStatus": "BACKUP #3"}, {"n": "Kanazawa Station quick breakfast (before departure)", "city": "Kanazawa · Kanazawa Station", "cat": "Restaurant", "h": "Early morning", "note": "Alternative to eating in Toyama - grab something quick at Kanazawa Station itself before the early departure. ORDER: a pastry and coffee from one of the station bakeries, or an onigiri from a station convenience store if you're truly pressed for time.", "lat": null, "lng": null, "tags": ["quick", "convenient", "flexible"], "must": false, "meal": ["breakfast"], "bestTime": "Early morning, before 8am departure", "price": "yen (varies)", "highlight": "", "reservation": "Walk-in", "mapsLink": "", "tabelog": "", "ig": "", "website": "", "day_order": 6.0, "d": 14, "maybe": false, "priorityStatus": "BACKUP #5"}, {"n": "Kurobe Gorge Railway", "city": "Toyama · Unazuki Onsen / Kurobe Gorge", "cat": "Attraction", "h": "Seasonal, late April-November; check current status given post-earthquake repairs", "note": "Open-air scenic train through one of Japan's deepest gorges - 40+ tunnels, 20+ bridges, ~80 minutes each way to Keyakidaira. Late October is peak autumn foliage season here. Sit right side going out, left side coming back for best views. Bring layers - open-air cars have no protection from the cold.", "lat": 36.8150304, "lng": 137.58601, "tags": ["scenic train", "autumn foliage", "unique experience", "must book ahead in peak season"], "must": true, "meal": [], "bestTime": "12:50pm train up, 3:19pm train back (about an hour at Keyakidaira)", "price": "yen (reserved open-air seats recommended)", "highlight": "Book open-air reserved seats 2-3 weeks ahead for late October - they sell out in peak foliage season. Check current operating status - full line to Keyakidaira reopens Oct 1 2026 after bridge repair.", "reservation": "BOOKED - Unazuki→Keyakidaira 12:50pm-2:12pm; return Keyakidaira 3:19pm, arrives Unazuki ~4:35pm", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Kurobe%20Gorge%20Railway%20Unazuki%20Station%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 8.0, "d": 14, "maybe": false, "priorityStatus": ""}, {"n": "Kuroya", "city": "Kanazawa · Near Kanazawa Station", "cat": "Restaurant", "h": "Evening", "note": "Cozy izakaya near Kanazawa Station, popular even among locals - locally sourced traditional seafood dishes paired with their own original junmaishu sake. Nos st after dark for the neon effect", "note": "The famously chaotic scramble crossing, one of the busiest pedestrian intersections in the world. Whole-group stop on the Day 25 afternoon, after COHINA - about 25 min from Tokyo Station on the JR Yamanote Line. See the crossing, grab photos from the Starbucks second-floor window or the Shibuya Sky observation deck if time allows, then continue on. No need for a long stay to appreciate it.", "lat": 35.6595, "lng": 139.7005, "tags": ["iconic", "quick stop", "whole group"], "must": true, "meal": [], "bestTime": "~4:45-5:45pm, as it gets dark (dusk is around 5pm in late October). Leave Shibuya by ~6:10pm for the 7:00pm dinner in Marunouchi", "price": "Free", "highlight": "Watch the crossing from the Starbucks second-floor window across the street", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Shibuya%20Crossing%20Tokyo%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 12.0, "d": 25, "maybe": false, "priorityStatus": ""}, {"n": "Yayoiken Higashi Ueno", "city": "Tokyo · Ueno", "cat": "Restaurant", "h": "7:00am-11:00pm daily", "note": "Genuine Japanese teishoku chain, open from 7am - right in Ueno, near your hotel. ORDER: the grilled mackerel set with a tamagoyaki add-on - specifically praised in reviews as an ideal Japanese breakfast. Order via touchscreen kiosk (English available), free rice/tea/pickle refills.", "lat": 35.7116, "lng": 139.7795, "tags": ["Japanese breakfast", "teishoku", "convenient", "Ueno"], "must": false, "meal": ["breakfast"], "bestTime": "Morning", "price": "yen (~1,000-1,500)", "highlight": "", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Yayoiken%20Higashi%20Ueno%20Tokyo%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 1.0, "d": 9, "maybe": false, "priorityStatus": ""}, {"n": "coffee murasaki", "city": "Tokyo · Ueno", "cat": "Cafe", "h": "9:00am-5:00pm daily", "note": "Small, highly regarded coffee s nhouse, obanzai-style breakfast, 5-minute walk from Gojo Station. ORDER: the one-soup-five-dish set featuring fresh fish of the day (grilled with salt or soy marinade), Omi rice, and seasonal Kyoto vegetables.", "lat": 34.993, "lng": 135.759, "tags": ["obanzai", "Kyoto breakfast", "Tabelog verified", "Gojo"], "must": false, "meal": ["breakfast"], "bestTime": "7:30am opening (Sunday) - the day is full, so start on time", "price": "yen (2,000-2,999)", "highlight": "", "reservation": "Online reservation available", "mapsLink": "https://www.google.com/maps/search/?api=1&query=M%26Maison%20Kyoto%20Gojo%20Japan", "tabelog": "https://tabelog.com/en/kyoto/A2601/A260201/26030947/", "ig": "", "website": "", "day_order": 1.0, "d": 18, "maybe": false, "priorityStatus": ""}, {"n": "Tsukiji Honganji Cafe Tsumugi", "city": "Tokyo · Tsukiji", "cat": "Restaurant", "h": "8:00am-6:00pm, L.O. 5:00pm", "note": "Famous '18-item breakfast' inside the grounds of Tsukiji Hongan-ji, overlooking the temple's main hall. Placed here on your whole-group day so everyone experiences it before the group splits on Day 26. ORDER: the signature 18-item breakfast set.", "lat": 35.6653, "lng": 139.77, "tags": ["temple cafe", "breakfast", "Tabelog verified", "Tsukiji"], "must": false, "meal": ["breakfast"], "bestTime": "Morning", "price": "yen (2,000-2,999)", "highlight": "", "reservation": "Online reservation available for breakfast hours", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Tsukiji%20Honganji%20Cafe%20Tsumugi%20Tokyo%20Japan", "tabelog": "https://tabelog.com/en/tokyo/A1313/A131301/13215158/", "ig": "", "website": "", "day_order": 1.0, "d": 24, "maybe": false, "priorityStatus": ""}, {"n": "Saiko Shinkan (菜香新館)", "city": "Yokohama · Chinatown", "cat": "Restaurant", "h": "11:30am-3:30pm (lunch), closed Tuesdays", "note": "Cantonese dim sum specialist across 5 floors, established 1988, selected for Tabelog's Chinese Restaurant Top 100 four separate years. ORDER: their dim sum course - shrimp dumplings and char siu bao are specifically praised. English menu and English/Chinese-speaking staff available.", "lat": 35.4425, "lng": 139.6461, "tags": ["dim sum", "Cantonese", "Tabelog verified", "Chinatown"], "must": false, "meal": ["lunch"], "bestTime": "~12:45pm, first stop in Chinatown after the Yokohama Station locker - walk-in, expect a Saturday queue; lunch ends 3:30pm", "price": "yen (3,000-3,999 lunch)", "highlight": "", "reservation": "Reservations only accepted for dinner - lunch is walk-in only. Closed Tuesdays.", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Saiko%20Shinkan%20Yokohama%20Chinatown%20Japan", "tabelog": "https://tabelog.com/en/kanagawa/A1401/A140105/14003055/", "ig": "", "website": "", "day_order": 5.0, "d": 24, "maybe": false, "priorityStatus": "PRIORITY"}, {"n": "Coin locker at Yokohama Station (Costco haul)", "city": "Yokohama · Yokohama Station", "cat": "Attraction", "h": "", "note": "Drop off Costco purchases in a Large or Extra-Large locker here before continuing to Chinatown sightseeing. Collect on the way back to the hotel at the end of the day. If lockers are full, the ecbo cloak app can reserve storage space at nearby partner locations.", "lat": 35.4657, "lng": 139.6222, "tags": ["practical", "locker", "luggage"], "must": false, "meal": [], "bestTime": "", "price": "yen (600-1,000/day for large/XL)", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Yokohama%20Station%20coin%20lockers%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 4.0, "d": 24, "maybe": false, "priorityStatus": ""}, {"n": "Cup Noodles Museum", "city": "Yokohama · Shinko (next to Red Brick Warehouse)", "cat": "Attraction", "h": "10:00am-6:00pm, closed Tuesdays", "note": "Interactive tribute to Momofuku Ando, inventor of instant ramen. Highlight is the 'Make Your Own Cup Noodles' workshop - design your own cup and choose from dozens of soup/topping combinations. Workshop tickets are same-day only and can run out, so by mid-afternoon the workshop may be full - the museum itself is still worth the visit.", "lat": 35.4554755, "lng": 139.6388669, "tags": ["museum", "hands-on", "family-friendly", "verified"], "must": true, "meal": [], "bestTime": "~3:30pm after Chinatown (2 subway stops + walk). Workshop tickets are same-day and may be gone by then on a Saturday; museum closes 6pm, no entry after 5:30pm", "price": "yen (500 entry + 500 for the cup noodle workshop)", "highlight": "Design and make your own cup noodles to take home", "reservation": "The My CUPNOODLES Factory workshop cannot be booked: numbered tickets are handed out at the museum on the day, first come first served. Only general admission can be bought online.", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Cup%20Noodles%20Museum%20Yokohama%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 11.0, "d": 24, "maybe": false, "priorityStatus": ""}, {"n": "Asakusa Station quick breakfast", "city": "Tokyo · Asakusa (Tobu Station)", "cat": "Restaurant", "h": "From ~6am (convenience store/kiosk hours) - buy the night before if unsure", "note": "Grab something quick from a convenience store or station kiosk before the 6:30am Revaty Kegon 1 (arrives Tobu-Nikko 8:25am) - nothing sit-down opens early enough for this departure time. Save the real breakfast experience for after you arrive in Nikko.", "lat": 35.7108, "lng": 139.7994, "tags": ["quick", "early departure", "convenience"], "must": false, "meal": ["breakfast"], "bestTime": "By ~6:15am, before the 6:30am train", "price": "yen (light)", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Tobu%20Asakusa%20Station%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 1.0, "d": 10, "maybe": false, "priorityStatus": ""}, {"n": "Haneda Airport - Group Send-off", "city": "Tokyo · Haneda", "cat": "Attraction", "h": "Early morning", "note": "Whole group trave , "meal": ["snack"], "bestTime": "After Nijo Castle", "price": "Free to walk", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Sanjokai%20Shotengai%20Kyoto%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 9.0, "d": 17, "maybe": false, "priorityStatus": ""}, {"n": "Karahori Shotengai (空堀商店街)", "city": "Osaka · Near Osaka Castle (Tanimachi/Matsuyamachi area)", "cat": "Attraction", "h": "Early morning is quietest and most authentic", "note": "Genuinely retains old Osaka shitamachi character - a 100+ year old tofu shop still selling fresh yuba (sells out early), backstreets lined with century-old nagaya row houses. A real residential feel, not built for visitors. Locals recommend early morning for the most authentic experience.", "lat": 34.6764, "lng": 135.5165, "tags": ["old shitamachi", "local shopping street", "quiet"], "must": false, "meal": [], "bestTime": "~10:30-11:00am, before the old tofu shop's yuba sells out. About 20 min on foot east from Kuromon", "price": "Free to walk", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Karahori%20Shotengai%20Osaka%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 2.0, "d": 20, "maybe": false, "priorityStatus": ""}, {"n": "Motomachi's backstreets", "city": "Yokohama · Behind Motomachi Shopping Street", "cat": "Attraction", "h": "Varies by shop", "note": "Yokohama's own official tourism site recommends the backstreets behind the main Motomachi Shopping Street specifically - stylish cafes, individual zakka shops, well-regarded restaurants, a quieter counterpoint to Chinatown's crowds right next door. Same station (Motomachi-Chukagai).", "lat": 35.4394, "lng": 139.6503, "tags": ["local backstreets", "quiet", "near Chinatown"], "must": false, "meal": [], "bestTime": "Daytime", "price": "Free to walk", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Motomachi%20Shopping%20Street%20Yokohama%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 9.0, "d": 24, "maybe": false, "priorityStatus": ""}, {"n": "Sakai Kokodo Ukiyo-e (酒井好古堂)", "city": "Tokyo · Nakamise-dori, Asakusa", "cat": "Shopping", "h": "Varies, generally 10am-6pm", "note": "Genuinely affordable ukiyo-e prints - postcards, reproductions, and reprints starting from a few hundred yen, alongside pricier originals if you want something more serious. Two locations in the immediate area (Nakamise-dori and Denbo-in-dori) with slightly different stock, worth checking both if time allows. Right on your existing walking path.", "lat": 35.7115, "lng": 139.7962, "tags": ["ukiyo-e", "affordable prints", "woodblock"], "must": false, "meal": [], "bestTime": "Daytime", "price": "yen (very affordable for reproductions, up to significant for originals)", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Sakai%20Kokodo%20Ukiyo-e%20Nakamise%20Asakusa%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 6.0, "d": 9, "maybe": false, "priorityStatus": ""}, {"n": "GU Okachimachi", "city": "Tokyo · Okachimachi (near Ueno/Ameyoko)", "cat": "Shopping", "h": "11am-9pm typically", "note": "UNIQLOs affordable fast-fashion sister brand, genuinely close to Ameyoko/Ueno.", "lat": 35.7075, "lng": 139.7746, "tags": ["GU", "fast fashion", "affordable"], "must": false, "meal": [], "bestTime": "Daytime", "price": "yen (budget fast fashion)", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=GU%20Okachimachi%20Tokyo%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 18.0, "d": 9, "maybe": false, "priorityStatus": ""}, {"n": "Welcia Ueno/Okachimachi", "city": "Tokyo · Ueno/Okachimachi area", "cat": "Shopping", "h": "Some locations 24 hours, check nearest branch", "note": "Skincare and drugstore chain, multiple branches in the Ueno/Okachimachi area, some genuinely 24-hour. Good o late on Day 24", "price": "yen (discount pricing)", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=%E3%83%89%E3%83%B3%E3%83%BB%E3%82%AD%E3%83%9B%E3%83%BC%E3%83%86%20%E6%96%B0%E5%AE%BF%E6%AD%8C%E8%88%9E%E4%BC%8E%E7%94%BA%E5%BA%97%20%E6%9D%B1%E4%BA%AC%E9%83%BD%E6%96%B0%E5%AE%BF%E5%8C%BA%E6%AD%8C%E8%88%9E%E4%BC%8E%E7%94%BA1-16-5", "tabelog": "", "ig": "", "website": "", "day_order": 9.0, "d": 23, "maybe": false, "priorityStatus": ""}, {"n": "3COINS Ecute Ueno", "city": "Tokyo · Inside Ueno Station", "cat": "Shopping", "h": "10am-9pm typically", "note": "Affordable variety/accessory store (most items 300 yen), located right inside Ueno Station itself.", "lat": 35.7141, "lng": 139.7774, "tags": ["3COINS", "affordable", "variety goods"], "must": false, "meal": [], "bestTime": "Anytime", "price": "yen (very affordable, ~300 yen items)", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=3COINS%20Ecute%20Ueno%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 16.0, "d": 9, "maybe": false, "priorityStatus": ""}, {"n": "Teramachi & Shinkyogoku Arcades", "city": "Kyoto · Kawaramachi/Pontocho area", "cat": "Shopping", "h": "Most shops until 8-9pm", "note": "Two connected covered arcades, directly adjacent to Nishiki Market, a few minutes walk from Pontocho where your dinner already is. Genuinely unique finds not covered elsewhere: POKER FACE (eyewear specialist), The REAL McCOYS (famous vintage Americana), Roeco by Jam (vintage/import fashion), Mishima-tei (historic sukiyaki since the Meiji era). Also has snack stalls (crepes, Taiwanese castella) if you want a walking treat after dinner.", "lat": 35.0068, "lng": 135.7688, "tags": ["shopping arcade", "near Pontocho", "unique shops"], "must": false, "meal": [], "bestTime": "Evening, after dinner", "price": "yen (wide range)", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Shinkyogoku%20Shopping%20Street%20Kyoto%20Japan", "tabelog": "", "ig": "", "website": "", "day_order": 25.0, "d": 18, "maybe": false, "priorityStatus": ""}, {"n": "Kinako to Torori (きなことろり)", "city": "Kyoto · Gion", "cat": "Snacks/Sweets", "h": "Check current hours", "note": "Warabi mochi specialty shop by the established Kisho Karyo brand, dedicated to showcasing deep-roasted kinako as the star ingredient. Fresh warabi mochi made daily, wrapped by hand in house-roasted kinako - a genuine snack, not a drink.", "lat": 35.0028, "lng": 135.7756, "tags": ["kinako", "warabi mochi", "Gion", "snack"], "must": false, "meal": ["snack"], "bestTime": "Anytime", "price": "yen (light)", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Kinako%20to%20Torori%20Gion%20Kyoto%20Japan", "tabelog": "", "ig": "", "website": "https://kinakototorori.jp/", "day_order": 15.0, "d": 18, "maybe": false, "priorityStatus": ""}, {"n": "Nakamura Tokichi Honten (中村藤吉本店)", "city": "Uji · Near Uji Station", "cat": "Snacks/Sweets", "h": "Check current hours, closed Tuesdays", "note": "Founded 1854, 170+ years - one of the two most famous names (alongside Ito Kyuemon) in spreading Uji tea nationally. Tabelog 3.55, selected for the West 100 Japanese sweets list 2023. ORDER: nama-cha jelly (genuinely unusual to find hojicha wagashi, not just matcha) - a real snack format. Right on Ujibashi-dori, the same street connecting Uji Station to Byodo-in, so this needs zero detour from your existing route.", "lat": 34.8908, "lng": 135.8058, "tags": ["genmaicha", "hojicha", "tea snacks", "Uji specialist"], "must": false, "meal": ["snack"], "bestTime": "Daytime", "price": "yen (light, cookie box)", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Nakamura%20Tokichi%20Honten%20Uji%20Ichiban%20Japan", "tabelog": "https://tabelog.com/en/kyoto/A2607/A260701/26000722/", "ig": "", "website": "https://www.tsujirihei.co.jp/", "day_order": 7.0, "d": 21, "maybe": false, "priorityStatus": ""}, {"n": "Tsujirihei Honten (辻利兵衛本店)", "city": "Uji · Ujibashi-dori (same street as Nakamura Tokichi)", "cat": "Snacks/Sweets", "h": "Check current hours, closed Tuesdays", "note": "Right on Ujibashi-dori. ORDER specifically these souvenir items: Uji matcha nama dorayaki Doosenbo (宇治抹茶生どら焼き 童仙房), Kyo matcha Take Baumkuchen (京抹茶「竹」バウム), and the 3-flavor langue de chat set (宇治茶三種お濃いくちラングドシャ茶賓 - matcha/hojicha/genmaicha). Tabelog 3.30.", "lat": 34.8895, "lng": 135.8033, "tags": ["souvenirs", "genmaicha", "hojicha", "Uji tea specialist"], "must": false, "meal": ["snack"], "bestTime": "Same visit as Nakamura Tokichi", "price": "yen (light, souvenir boxes)", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Tsujirihei%20Honten%20Uji%20Ujibashi-dori%20Japan", "tabelog": "https://tabelog.com/en/kyoto/A2607/A260701/26005593/", "ig": "", "website": "https://www.tsujirihei.co.jp/", "day_order": 8.0, "d": 21, "maybe": false, "priorityStatus": ""}, {"n": "Dotonbori Jihei (道頓堀治兵衛)", "city": "Osaka · Namba, Dotonbori", "cat": "Restaurant", "h": "Check current hours, lunch and dinner service", "note": "Fugu specialist, 2 min walk from Namba Station Exit 25, right in Dotonbori. Tabelog 3.38 - genuine, legally licensed operation (fugu handling is strictly regulated by law across Japan, requiring certified staff). Score reflects casual/value positioning, not safety concerns. ORDER: the seasonal Cosmos course (秋桜) - explicitly combines fugu hot pot with matsutake dobin-mushi, matching what drew you to Yanaka no Suzume originally. Genuine online reservation available. River-view seating popular.", "lat": 34.6685, "lng": 135.501, "tags": ["fugu", "matsutake", "Dotonbori", "Tabelog verified 3.38", "online booking"], "must": false, "meal": ["dinner"], "bestTime": "6:00pm - confirmed booking", "price": "yen (moderate, 6,000-7,999)", "highlight": "", "reservation": "CONFIRMED - 6:00pm reservation booked", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Dotonbori%20Jihei%20Namba%20Osaka%20Japan", "tabelog": "https://tabelog.com/en/osaka/A2701/A270202/27006186/", "ig": "", "website": "https://doutonborijihey.foodre.jp/", "day_order": 15.0, "d": 20, "maybe": false, "priorityStatus": ""}, {"n": "Nezu Kamachiku (根津釜竹)", "city": "Tokyo · Nezu", "cat": "Restaurant", "h": "11:30am-2:30pm, 5:30pm-9pm approx, closed Sun evening and Mon", "note": "Small family-run udon specialist (father-son operation originally from Habikino, Osaka; opened in Tokyo 2005), housed in a beautiful Kuma Kengo-designed building built around a 1910 stone sake warehouse. Tabelog 3.66 (1,300+ reviews), Tabelog 100 Udon EAST 2024 selection. Genuine online instant reservation, no phone needed. ORDER: kamaage udon (hot, in its cooking water) or zaru udon (cold, dipping style) - the menu is intentionally simple, with the focus entirely on noodle quality. Good izakaya-style side dishes and sake list too.", "lat": 35.7202, "lng": 139.7626, "tags": ["udon", "small family-run", "Tabelog 100", "Nezu", "genuine online booking"], "must": false, "meal": ["dinner"], "bestTime": "Evening, book ahead given genuine popularity", "price": "yen (moderate, 5,000-5,999 with drinks/sides)", "highlight": "", "reservation": "CONFIRMED - 6:15pm reservation booked", "mapsLink": "https://www.google.com/maps/search/?api=1&query=Nezu%20Kamachiku%20Tokyo%20Japan", "tabelog": "https://tabelog.com/en/tokyo/A1311/A131106/13020252/", "ig": "", "website": "", "day_order": 31.0, "d": 9, "maybe": false, "priorityStatus": ""}, {"n": "JINS Atre Ueno (eye exam + glasses)", "city": "Tokyo · Inside Atre Ueno, right at Ueno Station", "cat": "Shopping", "h": "10:00am-9:00pm", "note": "Free eye exam, no doctor visit or prescription needed - standard single-vision glasses ready in as little as 30 minutes. JINS explicitly confirms English-speaking staff and that not speaking Japanese is no barrier. Scheduled for the Day 11 evening (Sun 11 Oct), on the way back from Kamakura and before dinner. This is your last evening in Ueno - the train to Kanazawa leaves ~10:00am on Day 12, when the shop only opens - so choose lenses that can be made the same evening. FALLBACK: if they are not ready before the 9:00pm close, collect them on Day 25 (from Ginza, about 12 min to Ueno on the Ginza Line) or the Day 27 morning from 10am - tell the counter your pickup date and ask how long they hold an order. Note: this is the full-service Atre Ueno location, not the smaller ecute Ueno store inside the ticket gates, which ships glasses later rather than same-day.", "lat": 35.7135, "lng": 139.7774, "tags": ["eye exam", "glasses", "English-speaking staff", "same-day"], "must": false, "meal": [], "bestTime": "~7:00-8:00pm, straight off the train from Kamakura (Ueno ~6:50pm). Order by ~8:00pm at the latest - the shop closes at 9:00pm. Dinner follows at ~8:15pm at Tori no Ichi (about 5 min walk)", "price": "yen (from 5,500 yen including lenses)", "highlight": "", "reservation": "Walk-in, take a number at the counter", "mapsLink": "https://www.google.com/maps/search/?api=1&query=JINS%20Atre%20Ueno%20Japan", "tabelog": "", "ig": "", "website": "https://store-jp.jins.com/b/jins/info/20032/", "day_order": 13.0, "d": 11, "maybe": false, "priorityStatus": ""}, {"n": "Seijo Ishii Atre Ueno", "city": "Tokyo · Inside Atre Ueno, JR Ueno Station Shinobazu exit", "cat": "Shopping", "h": "7:30am-11:00pm", "note": "Upscale grocery right inside Ueno Station, 1 min from the Shinobazu exit. Good prepared food options (bento, deli, pastries), not just raw groceries. Open until 11pm.", "lat": 35.7135, "lng": 139.7774, "tags": ["supermarket", "late-night option", "inside Ueno Station"], "must": false, "meal": ["dinner"], "bestTime": "Alternative to a sit-down dinner, if you want something quick after arriving back from Nikko", "price": "yen (moderate, upscale grocery)", "highlight": "", "reservation": "", "mapsLink": "https ght.", "lat": 35.7108, "lng": 139.7799, "tags": ["supermarket", "24 hours", "groceries", "Ueno east"], "must": false, "meal": [], "bestTime": "Last stop of the night, on the way back to the accommodation", "price": "", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=%E3%83%9E%E3%83%AB%E3%82%A8%E3%83%84%20%E6%9D%B1%E4%B8%8A%E9%87%8E%E5%BA%97", "tabelog": "", "ig": "", "website": "", "day_order": 20.0, "d": 8, "maybe": false, "priorityStatus": ""}, {"n": "Maibasuke Taito Shitaya 1-chome (supermarket)", "city": "Tokyo · Shitaya / Iriya", "cat": "Market", "h": "7:00am-midnight", "note": "Alternative to Maruetsu if the accommodation is further north-east toward Iriya. Small AEON-affiliated mini-supermarket, cheaper than a convenience store. Closes at midnight - go to Maruetsu instead if you are running later.", "lat": 35.7205, "lng": 139.7825, "tags": ["supermarket", "Iriya", "alternative"], "must": false, "meal": [], "bestTime": "Before midnight", "price": "", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=%E3%81%BE%E3%81%84%E3%81%B0%E3%81%99%E3%81%91%E3%81%A3%E3%81%A8%20%E5%8F%B0%E6%9D%B1%E4%B8%8B%E8%B0%B71%E4%B8%81%E7%9B%AE%E5%BA%97", "tabelog": "", "ig": "", "website": "", "day_order": 21.0, "d": 8, "maybe": false, "priorityStatus": "ALTERNATIVE"}, {"n": "Maruetsu Petit Higashi-Nippori (24h supermarket)", "city": "Tokyo · Higashi-Nippori", "cat": "Market", "h": "24 hours", "note": "Alternative 24-hour option if the accommodation is further north toward Uguisudani/Nippori. Smaller than the Higashi-Ueno Maruetsu.", "lat": 35.728, "lng": 139.777, "tags": ["supermarket", "24 hours", "alternative"], "must": false, "meal": [], "bestTime": "Anytime late", "price": "", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=%E3%83%9E%E3%83%AB%E3%82%A8%E3%83%84%E3%83%97%E3%83%81%20%E6%9D%B1%E6%97%A5%E6%9A%AE%E9%87%8C", "tabelog": "", "ig" pm.", "lat": 35.659, "lng": 139.7036, "tags": ["shopping", "COHINA", "denim", "petite", "feminine natural"], "must": false, "meal": [], "bestTime": "~3:45pm, after dropping the Ginza bags at your stay (Tokyo Station to Shibuya is about 25 min on the JR Yamanote Line) - closes 8pm on Sundays", "price": "", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=COHINA%20STORE%20%E6%B8%8B%E8%B0%B7%E3%83%92%E3%82%AB%E3%83%AA%E3%82%A8%20ShinQs", "tabelog": "", "ig": "", "website": "https://cohina.net/blogs/news/shoplist", "day_order": 11.0, "d": 25, "maybe": false, "priorityStatus": ""}, {"n": "KITTE Marunouchi: Nakagawa Masashichi (4F) + GOOD DESIGN STORE (3F, MONPE)", "city": "Tokyo · KITTE, next to Tokyo Station Marunouchi South Exit", "cat": "Shopping", "h": "Both 11:00-20:00 daily", "note": "Two picks in one building beside Tokyo Station. 4F: Nakagawa Masashichi Shoten (linen, household goods, apparel). 3F: GOOD DESIGN STORE TOKYO by NOHARA, which sells Unagi no Nedoko MONPE trousers - stock varies, so check the sizes/fabrics you want are there. Both close at 8pm.", "lat": 35.6796, "lng": 139.7648, "tags": ["shopping", "Nakagawa Masashichi", "MONPE", "texture and design", "Tokyo Station"], "must": false, "meal": [], "bestTime": "After the Daimaru food hall on arrival, ~5:15-6:15pm with the 10:34am train from Kinosaki - closes 8pm", "price": "", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=KITTE%E4%B8%B8%E3%81%AE%E5%86%85%20%E6%9D%B1%E4%BA%AC%E9%83%BD%E5%8D%83%E4%BB%A3%E7%94%B0%E5%8C%BA%E4%B8%B8%E3%81%AE%E5%86%852-7-2", "tabelog": "", "ig": "", "website": "https://marunouchi.jp-kitte.jp/shop/index.jsp?bf=1&fmt=6&shopid=1068", "day_order": 7.0, "d": 23, "maybe": false, "priorityStatus": ""}, {"n": "iki ESPRESSO", "city": "Tokyo · Kiyosumi-Shirakawa (Tokiwa)", "cat": "Cafe", "h": "Sat-Sun 8:00am-6:00pm; Mon-Fri 8:00am-5:00pm", "note": "New Zealand-style cafe in Tokyo's coffee district, Tabelog 3.59 (1,400+ reviews) - flat whites and a proper sit-down brunch-style breakfast. It's one of the few good options open at 8am on a Sunday in this area (the Monzen-nakacho cafes open at 9-10am). CARD/PAYPAY ONLY - no cash. From here it's one stop on the Toei Oedo Line (Kiyosumi-shirakawa to Monzen-nakacho) or a ~20 min walk to the antique market.", "lat": 35.6855, "lng": 139.796, "tags": ["coffee", "breakfast", "Kiyosumi-Shirakawa", "cashless"], "must": false, "meal": ["breakfast"], "bestTime": "8:00am opening - aim to leave by ~8:30", "price": "", "highlight": "", "reservation": "Walk-in", "mapsLink": "https://www.google.com/maps/search/?api=1&query=iki%20ESPRESSO%20%E6%9D%B1%E4%BA%AC%E9%83%BD%E6%B1%9F%E6%9D%B1%E5%8C%BA%E5%B8%B8%E7%9B%A42-2-12", "tabelog": "https://tabelog.com/en/tokyo/A1312/A131201/13190426/", "ig": "", "website": "", "day_order": 1.0, "d": 25, "maybe": false, "priorityStatus": "PRIORITY"}, {"n": "Tomioka Hachimangu Antique Market", "city": "Tokyo · Monzen-nakacho", "cat": "Market", "h": "6:00am-5:00pm on the 1st (not Jan), 2nd, 4th and 5th Sundays - Oct 25 is the 4th Sunday", "note": "Long-running outdoor antique and flea market in the grounds of Tomioka Hachimangu shrine: vintage kimono and fabric, ceramics, old tools, prints and small curios. Plan it in two passes around the fire ritual next door - a first look from ~8:45 before the 9:00 ritual (early is when dealers put out their best pieces), then back from ~9:30 until ~10:40. Bring cash; most stalls don't take cards. Dates can change without notice - check @tomioka_antiquemarket on Instagram the week before.", "lat": 35.6719, "lng": 139.7993, "tags": ["antiques", "flea market", "vintage kimono", "ceramics", "secondhand", "cash only"], "must": false, "meal": [], "bestTime": "~8:45-9:00, then again ~9:30-10:40", "price": "", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=%E5%AF%8C%E5%B2%A1%E5%85%AB%E5%B9%A1%E5%AE%AE%20%E6%9D%B1%E4%BA%AC%E9%83%BD%E6%B1%9F%E6%9D%B1%E5%8C%BA%E5%AF%8C%E5%B2%A11-20-3", "tabelog": "", "ig": "", "website": "https://kottouichi.jp/tomioka.htm", "day_order": 3.0, "d": 25, "maybe": false, "priorityStatus": ""}, {"n": "Fukagawa Fudo-do Fire Ritual (Goma)", "city": "Tokyo · Monzen-nakacho (next to Tomioka Hachimangu)", "cat": "Temple / Shrine", "h": "Goma fire ritual daily at 9:00, 11:00, 13:00, 15:00, 17:00", "note": "Free to watch: monks burn wooden prayer sticks in a large fire while chanting sutras, backed by taiko drums billed as the largest in Japan - loud and dramatic. About a 2-3 minute walk from the antique market. You don't need to stay for the whole ceremony: arrive a few minutes early, sit or stand near the back, and leave quietly between chants. No photos or video in the main hall during the ritual (check signs on arrival). 15-20 minutes is enough to see the fire and hear the drums.", "lat": 35.6723, "lng": 139.7976, "tags": ["temple", "fire ritual", "taiko", "free", "cultural"], "must": false, "meal": [], "bestTime": "9:00am ritual", "price": "", "highlight": "", "reservation": "", "mapsLink": "https://www.google.com/maps/search/?api=1&query=%E6%88%90%E7%94%B0%E5%B1%B1%E6%B7%B1%E5%B7%9D%E4%B8%8D%E5%8B%95%E5%A0%82%20%E6%9D%B1%E4%BA%AC%E9%83%BD%E6%B1%9F%E6%9D%B1%E5%8C%BA%E5%AF%8C%E5%B2%A11-17-13", "tabelog": "", "ig": "", "website": "", "day_order": 4.0, "d": 25, "maybe": false, "priorityStatus": ""}, {"n": "Tokyo Station breakfast (backup)", "city": "Tokyo · Tokyo Station (Yaesu / Ichibangai / Gransta Marunouchi)", "cat": "Restaurant", "h": "Sunday openings: Hatsufuji 7:00; Rokurinsha & Tamejiro 7:30; Mango Tree Gapao & Sushiko Nagomi 8:00", "note": "Backup if you'd rather eat near the hotel before heading out (Tozai Line from Nihonbashi or Otemachi to Monzen-nakacho, ~15 min door to door). All outside the JR ticket gates, all open early on Sunday: (1) Rokurinsha, Tokyo Ramen Street B1F - morning tsukemen (dipping noodles) ¥790, 7:30-9:45, Tabelog 3.77 a <script type="text/plain" id="appScript">

const META = DATA.meta;
const STOPS = DATA.stops;
const dayNums = Object.keys(META).map(Number).sort((a,b)=>a-b);
