                      if len(data) < 2000:
                          raise ValueError("too small")
                      open(os.path.join(out, item_id + ".jpg"), "wb").write(data)
                      print("OK  ", item_id, u); ok += 1
                      break
                  except Exception as e:
                      print("skip", item_id, u, e)
              else:
                  print("FAIL", item_id); fail += 1
          print(f"done: {ok} saved, {fail} failed")
